<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Nouvelle</title>

  <script src="https://cdn.jsdelivr.net/npm/showdown/dist/showdown.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html">← Retour à la liste</a>

<article id="post">
  <h1 id="post-title"></h1>
  <p id="post-meta"></p>
  <img id="post-cover" style="max-width:400px; display:none;">
  <div id="content"></div>
</article>

<script>
async function loadPost() {
  const params = new URLSearchParams(location.search);
  const file = params.get("file");

  if (!file) {
    document.getElementById("content").innerText = "Aucun fichier spécifié.";
    return;
  }

  try {
    const response = await fetch("posts/" + file);
    if (!response.ok) throw new Error("Fichier introuvable");

    const txt = await response.text();

    // Extraire frontmatter
    let frontmatter = {};
    let body = txt;

    const match = txt.match(/^---([\s\S]*?)---([\s\S]*)$/);
    if (match) {
      const yaml = match[1];
      body = match[2];

      yaml.split("\n").forEach(line => {
        const m = line.match(/^(\w+):\s*(.*)$/);
        if (m) {
          let key = m[1];
          let value = m[2];

          // Nettoyage simple
          value = value.replace(/^"|"$/g, "");

          // tableaux simples
          if (value.startsWith("[") && value.endsWith("]")) {
            value = value
              .slice(1, -1)
              .split(",")
              .map(v => v.trim().replace(/^"|"$/g, ""));
          }

          frontmatter[key] = value;
        }
      });
    }

    // Affichage métadonnées
    document.getElementById("post-title").innerText = frontmatter.title || file;

    let meta = [];
    if (frontmatter.author) meta.push(frontmatter.author);
    if (frontmatter.date) meta.push(frontmatter.date);
    document.getElementById("post-meta").innerText = meta.join(" — ");

    if (frontmatter.cover && frontmatter.cover.image) {
      const img = document.getElementById("post-cover");
      img.src = "images/" + frontmatter.cover.image;
      img.style.display = "block";
    }

    // Markdown → HTML
    const converter = new showdown.Converter();
    const html = converter.makeHtml(body);

    document.getElementById("content").innerHTML = html;

    // Titre de la page navigateur
    document.title = frontmatter.title || "Nouvelle";

  } catch (e) {
    document.getElementById("content").innerHTML =
      "<p>Impossible de charger la nouvelle.</p><p>" + e.message + "</p>";
  }
}

loadPost();
</script>

</body>
</html>
